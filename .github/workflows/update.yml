name: Refresh Release Radar catalog
on:
  schedule:
    - cron: '45 10 * * *'
    - cron: '45 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: release-radar-catalog-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Only refresh at 6:45 a.m. Eastern
        id: timing
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            OFFSET=$(TZ=America/Toronto date +%z)
            EXPECTED='45 11 * * *'
            [[ "$OFFSET" == "-0400" ]] && EXPECTED='45 10 * * *'
            if [[ "${{ github.event.schedule }}" != "$EXPECTED" ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.timing.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Scan release catalog with a deadline
        if: steps.timing.outputs.run == 'true'
        timeout-minutes: 20
        continue-on-error: true
        env:
          MUSICBRAINZ_CONTACT: ${{ secrets.MUSICBRAINZ_CONTACT }}
        run: python update_radar.py
      - name: Regenerate HTML using latest available data
        if: steps.timing.outputs.run == 'true'
        run: python render_page.py
      - name: Commit updated release data
        if: steps.timing.outputs.run == 'true'
        run: |
          git config user.name release-radar-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases.json index.html radar.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh release radar data"
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.timing.outputs.run == 'true'
      - name: Prepare deployment files
        if: steps.timing.outputs.run == 'true'
        run: |
          mkdir -p _site
          cp index.html releases.json _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.timing.outputs.run == 'true'
        with:
          path: './_site'
      - uses: actions/deploy-pages@v4
        if: steps.timing.outputs.run == 'true'
        id: deployment
